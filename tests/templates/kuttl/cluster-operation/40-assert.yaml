---
# The recreated StatefulSets must bring the cluster back to ready, and the recreated
# objects must carry an owner reference back to the HbaseCluster so that garbage
# collection still works for them.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
metadata:
  name: recreate-owned-resources
timeout: 300
commands:
  - script: kubectl -n $NAMESPACE wait --for=condition=available hbaseclusters.hbase.stackable.tech/test-hbase --timeout 301s
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-hbase-master-default
  ownerReferences:
    - apiVersion: hbase.stackable.tech/v1alpha1
      controller: true
      kind: HbaseCluster
      name: test-hbase
status:
  readyReplicas: 1
  replicas: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-hbase-regionserver-default
  ownerReferences:
    - apiVersion: hbase.stackable.tech/v1alpha1
      controller: true
      kind: HbaseCluster
      name: test-hbase
status:
  readyReplicas: 1
  replicas: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-hbase-restserver-default
  ownerReferences:
    - apiVersion: hbase.stackable.tech/v1alpha1
      controller: true
      kind: HbaseCluster
      name: test-hbase
status:
  readyReplicas: 1
  replicas: 1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-hbase-serviceaccount
  ownerReferences:
    - apiVersion: hbase.stackable.tech/v1alpha1
      controller: true
      kind: HbaseCluster
      name: test-hbase
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-hbase-rolebinding
  ownerReferences:
    - apiVersion: hbase.stackable.tech/v1alpha1
      controller: true
      kind: HbaseCluster
      name: test-hbase
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: test-hbase-master
  ownerReferences:
    - apiVersion: hbase.stackable.tech/v1alpha1
      controller: true
      kind: HbaseCluster
      name: test-hbase
---
apiVersion: policy/v1
