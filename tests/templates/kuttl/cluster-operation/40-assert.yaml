metadata:
  name: test-hbase-regionserver
  ownerReferences:
    - apiVersion: hbase.stackable.tech/v1alpha1
      controller: true
      kind: HbaseCluster
      name: test-hbase
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: test-hbase-restserver
  ownerReferences:
    - apiVersion: hbase.stackable.tech/v1alpha1
      controller: true
      kind: HbaseCluster
      name: test-hbase
